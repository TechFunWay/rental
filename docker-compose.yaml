version: '3.8'
services:
  rental:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techfunway-rental
    ports:
      - "8910:8910"
    volumes:
      # 运行时数据/配置目录：数据库、上传文件、日志均存放于此。
      # 持久化该目录即可在重建/升级后保留全部账号、配置与数据。
      - rental-data:/app/data
    environment:
      # 日志模式：release 或 debug
      - ENV=release
      # 数据目录（容器内路径，需与上方 volume 挂载点一致）
      - DATA_DIR=/app/data
      # 服务端口（修改时需同步调整上方 ports 映射）
      # - PORT=8910
      # 公开接口每分钟限流，0 表示不限
      # - RATE_LIMIT=20
      # 允许的 CORS 来源，* 表示全部
      # - CORS_ORIGIN=*
      # 日志保留天数，0 表示永久保留
      # - LOG_RETENTION_DAYS=30
    # device-type=docker 仅用于匿名统计的平台分布；DISABLE_STATS=1 可完全关闭上报
    command: ["-data-dir", "/app/data", "-web-dir", "./static/dist", "-device-type", "docker"]
    restart: unless-stopped

volumes:
  rental-data:
